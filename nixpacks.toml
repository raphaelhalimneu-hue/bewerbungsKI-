[phases.setup]
nixPkgs = ["nodejs_22", "chromium", "nss", "nspr", "atk", "at-spi2-atk", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "libxkbcommon", "mesa", "expat", "alsa-lib", "pango", "cairo", "dbus", "glib"]

[variables]
COREPACK_INTEGRITY_KEYS = "0"

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/bewerbungski run build",
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "pnpm --filter @workspace/db run push --force && NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs"
