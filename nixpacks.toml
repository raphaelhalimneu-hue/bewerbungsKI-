[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/bewerbungski run build",
  "pnpm --filter @workspace/api-server run build",
  "DATABASE_URL=$DATABASE_URL pnpm --filter @workspace/db run push --accept-data-loss"
]

[start]
cmd = "NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs"
