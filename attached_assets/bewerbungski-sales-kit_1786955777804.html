/* ================= COMPONENTS ================= */

function CopyButton({ text, label }) {
  const [copied, setCopied] = useState(false);
  const onClick = () => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };
  return h('button', {
    onClick,
    className: 'text-xs px-3 py-1.5 rounded-full border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors whitespace-nowrap'
  }, copied ? '✓ ' + label : label);
}

function OfferCard({ offer, copyLabel }) {
  const fullText = `${offer.headline}\n${offer.price}\n${offer.benefits}\n${offer.cta}`;
  return h('div', { className: 'flex flex-col gap-2 p-4 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900' },
    h('div', { className: 'flex items-center justify-between gap-2' },
      h('span', { className: 'text-xs uppercase tracking-wide text-neutral-500' }, offer.label),
      offer.badge && h('span', { className: 'text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300' }, offer.badge)
    ),
    h('div', { className: 'text-lg font-bold' }, offer.headline),
    h('div', { className: 'text-2xl font-extrabold' }, offer.price),
    h('div', { className: 'text-sm text-neutral-600 dark:text-neutral-400 flex-1' }, offer.benefits),
    h('div', { className: 'text-sm font-semibold px-3 py-2 rounded-lg bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 text-center' }, offer.cta),
    h('div', { className: 'flex justify-end pt-1' }, h(CopyButton, { text: fullText, label: copyLabel }))
  );
}

function OfferLab({ lang, t }) {
  const offers = OFFERS[lang];
  return h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4' },
    offers.map((o, i) => h(OfferCard, { key: i, offer: o, copyLabel: t.copy }))
  );
}

function ExitIntent({ lang, t }) {
  const texts = EXIT_INTENTS[lang];
  return h('div', { className: 'flex flex-col gap-3' },
    texts.map((txt, i) => h('div', {
      key: i,
      className: 'flex items-start justify-between gap-3 p-4 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900'
    },
      h('p', { className: 'text-sm flex-1' }, txt),
      h(CopyButton, { text: txt, label: t.copy })
    ))
  );
}

function Tracker({ t }) {
  const [data, setData] = useState(() => {
    try {
      const saved = localStorage.getItem('bwki_tracker');
      return saved ? JSON.parse(saved) : { free: 0, clicks: 0, purchases: 0 };
    } catch (e) { return { free: 0, clicks: 0, purchases: 0 }; }
  });

  useEffect(() => {
    localStorage.setItem('bwki_tracker', JSON.stringify(data));
  }, [data]);

  const update = (key) => (e) => {
    const val = Math.max(0, Number(e.target.value) || 0);
    setData({ ...data, [key]: val });
  };

  const convRate = data.free > 0 ? ((data.purchases / data.free) * 100).toFixed(2) : '0.00';
  const clickRate = data.clicks > 0 ? ((data.purchases / data.clicks) * 100).toFixed(2) : '0.00';

  const field = (key, label) => h('div', { className: 'flex flex-col gap-1' },
    h('label', { className: 'text-xs text-neutral-500' }, label),
    h('input', {
      type: 'number', min: 0, value: data[key], onChange: update(key),
      className: 'px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 text-lg font-semibold'
    })
  );

  return h('div', { className: 'flex flex-col gap-6 max-w-md' },
    h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4' },
      field('free', t.freeGen), field('clicks', t.upgradeClicks), field('purchases', t.purchases)
    ),
    h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
      h('div', { className: 'p-4 rounded-xl bg-neutral-900 text-white dark:bg-white dark:text-neutral-900' },
        h('div', { className: 'text-xs opacity-70' }, t.convRate),
        h('div', { className: 'text-3xl font-extrabold' }, convRate + '%')
      ),
      h('div', { className: 'p-4 rounded-xl bg-neutral-200 dark:bg-neutral-800' },
        h('div', { className: 'text-xs opacity-70' }, t.clickRate),
        h('div', { className: 'text-3xl font-extrabold' }, clickRate + '%')
      )
    ),
    h('button', {
      onClick: () => setData({ free: 0, clicks: 0, purchases: 0 }),
      className: 'self-start text-xs px-3 py-1.5 rounded-full border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800'
    }, t.reset)
  );
}

function App() {
  const [lang, setLang] = useState('de');
  const [tab, setTab] = useState('offers');
  const [dark, setDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  const langMeta = LANGS.find(l => l.code === lang);
  const t = UI[lang];

  return h('div', {
    dir: langMeta.rtl ? 'rtl' : 'ltr',
    className: 'min-h-screen'
  },
    h('div', { className: 'max-w-5xl mx-auto px-4 py-6 flex flex-col gap-6' },

      // Header
      h('div', { className: 'flex flex-wrap items-center justify-between gap-3' },
        h('h1', { className: 'text-xl font-bold' }, t.title),
        h('div', { className: 'flex items-center gap-2 flex-wrap' },
          h('select', {
            value: lang, onChange: e => setLang(e.target.value),
            className: 'text-sm px-3 py-1.5 rounded-full border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900'
          }, LANGS.map(l => h('option', { key: l.code, value: l.code }, l.label))),
          h('button', {
            onClick: () => setDark(!dark),
            className: 'text-sm px-3 py-1.5 rounded-full border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900'
          }, dark ? '☀️' : '🌙')
        )
      ),

      // Tabs
      h('div', { className: 'flex gap-2 border-b border-neutral-200 dark:border-neutral-800' },
        ['offers', 'exit', 'tracker'].map(key => {
          const labels = { offers: t.offerLab, exit: t.exitIntent, tracker: t.tracker };
          const active = tab === key;
          return h('button', {
            key, onClick: () => setTab(key),
            className: `px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors ${active ? 'border-neutral-900 dark:border-white' : 'border-transparent text-neutral-500'}`
          }, labels[key]);
        })
      ),

      // Content
      tab === 'offers' && h(OfferLab, { lang, t }),
      tab === 'exit' && h(ExitIntent, { lang, t }),
      tab === 'tracker' && h(Tracker, { t })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
