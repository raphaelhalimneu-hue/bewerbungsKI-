<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BewerbungsKI – Professionelle Bewerbungen mit KI</title>
<meta name="description" content="Erstelle in wenigen Minuten professionelle Lebensläufe und Anschreiben – optimiert für den deutschen Arbeitsmarkt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ── RESET & VARIABLES ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1a56db;--brand-d:#1239a0;--brand-l:#e8f0fe;--accent:#0ea5e9;
  --ok:#16a34a;--warn:#d97706;--err:#dc2626;
  --bg:#f8f9fc;--bg2:#fff;--bg3:#f0f2f8;
  --text:#0f172a;--text2:#374151;--muted:#6b7280;--muted2:#9ca3af;
  --border:#e2e6f0;--border2:#cdd3e4;
  --sh:0 4px 16px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 16px 48px rgba(15,23,42,.12);
  --r:12px;--r-lg:20px;
  --ff:'Geist',system-ui,sans-serif;--fd:'Fraunces',Georgia,serif;
}
[data-theme=dark]{
  --bg:#0c0f1a;--bg2:#111827;--bg3:#1a2035;
  --text:#f1f5f9;--text2:#cbd5e1;--muted:#94a3b8;--muted2:#64748b;
  --border:#1f2d4a;--border2:#2d3f60;--brand-l:#172042;
  --sh:0 4px 16px rgba(0,0,0,.4);--sh-lg:0 16px 48px rgba(0,0,0,.5);
}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-family:var(--ff);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap;position:relative}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.3)}
.btn-p:hover{background:var(--brand-d);transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,86,219,.35)}
.btn-s{background:var(--bg3);color:var(--text2);border:1.5px solid var(--border)}
.btn-s:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.btn-g{background:transparent;color:var(--muted);padding:8px 14px}
.btn-g:hover{background:var(--bg3);color:var(--text)}
.btn-d{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
.btn-d:hover{background:var(--err);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-lg{padding:14px 32px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center}

/* ── FORM ── */
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.input,.textarea,.select{width:100%;padding:10px 14px;background:var(--bg2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;font-family:var(--ff);font-size:14px;transition:border-color .15s,box-shadow .15s;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.textarea{min-height:90px;resize:vertical}
.select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.05)}

/* ── NAV ── */
.nav{height:60px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(15,23,42,.05)}
.nav-brand{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.nav-brand span{color:var(--text)}

/* ── LAYOUT ── */
.app{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.si{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.si:hover{background:var(--bg3);color:var(--text)}
.si.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:14px 14px 4px}
.main{flex:1;padding:32px;max-width:880px}
@media(max-width:768px){.sidebar{display:none}.main{padding:16px}}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.fade{animation:fadeUp .3s ease both}
.spin{width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}

/* ── PROGRESS ── */
.prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:2px;transition:width .4s ease}
.step-line{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:2px}
.sdot{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;border:2px solid var(--border2);background:var(--bg2);color:var(--muted);flex-shrink:0;transition:all .2s;cursor:pointer}
.sdot.on{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(26,86,219,.12)}
.sdot.done{border-color:var(--ok);background:var(--ok);color:#fff}
.scon{flex:1;height:2px;background:var(--border);min-width:16px;max-width:50px}
.scon.done{background:var(--ok)}

/* ── TAG / BADGE ── */
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-l);color:var(--brand);padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600}
.tag-ok{background:#dcfce7;color:var(--ok)}
.tag-w{background:#fef3c7;color:var(--warn)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px);animation:fadeUp .2s}
.modal{background:var(--bg2);border-radius:var(--r-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:fadeUp .25s}
.mh{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between}
.mb{padding:20px 24px 24px}

/* ── CV PREVIEW ── */
.cv-wrap{background:#dde3f0;padding:24px;border-radius:16px;overflow-x:auto}
.cv-sheet{background:white;color:#111;font-family:'Geist',sans-serif;width:100%;max-width:760px;margin:0 auto;min-height:600px;box-shadow:0 8px 32px rgba(0,0,0,.15);border-radius:3px;overflow:hidden;font-size:13px;line-height:1.55}

/* ── TOAST ── */
.toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--sh-lg);animation:fadeUp .3s ease;display:flex;align-items:center;gap:10px;min-width:220px;max-width:340px;background:var(--bg2);border-left:4px solid var(--brand)}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}

/* ── HERO ── */
.hero{text-align:center;padding:56px 20px 40px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--brand-l);color:var(--brand);padding:6px 16px;border-radius:100px;font-size:13px;font-weight:600;margin-bottom:24px}
.hero-title{font-family:var(--fd);font-size:clamp(34px,6vw,60px);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin-bottom:20px}
.hero-title em{font-style:italic;color:var(--brand)}
.hero-sub{font-size:17px;color:var(--muted);max-width:500px;margin:0 auto 32px;line-height:1.6}
.feats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:32px}
.feat{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.feat .ok{color:var(--ok)}

/* ── PRICING ── */
.pc{border:2px solid var(--border);border-radius:var(--r-lg);padding:28px;background:var(--bg2);transition:all .2s}
.pc.hot{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--sh)}
.pc:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.price-num{font-size:36px;font-weight:800;color:var(--brand);line-height:1}

/* ── AUTH MODAL ── */
.auth-card{background:var(--bg2);border-radius:var(--r-lg);width:100%;max-width:420px;padding:36px;box-shadow:var(--sh-lg);animation:fadeUp .3s}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>

<script>
// ══════════════════════════════════════════════
// CONFIG – Werte nach dem Setup hier eintragen
// ══════════════════════════════════════════════
const CONFIG = {
  SUPABASE_URL: window.ENV_SUPABASE_URL || "https://bsdfaidadvdojyeiqcqj.supabase.co",
  SUPABASE_ANON_KEY: window.ENV_SUPABASE_ANON || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZGZhaWRhZHZkb2p5ZWlxY3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAzMDQsImV4cCI6MjA5MzA1NjMwNH0.UjDfb-w1-ABTiE4S_xp1Zx4wkecZ3S7icbEcooZobSk",
  APP_URL: window.location.origin,
};

// ── SUPABASE INIT ──
const { createClient } = supabase;
const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let STATE = {
  view: "home",       // home | wizard | documents | preview | pricing
  theme: "light",
  user: null,
  profile: null,      // { is_premium, documents_count, email }
  authModal: false,   // "login" | false
  wizardStep: 0,
  generating: false,
  streamPhase: "",
  documents: [],
  previewDoc: null,
  formData: blankForm(),
};

function blankForm() {
  return {
    personal: { firstName:"", lastName:"", title:"", email:"", phone:"", address:"", zip:"", city:"", linkedin:"", website:"", summary:"" },
    experience: [],
    education: [],
    skills: [],
    languages: [],
    jobad: { title:"", company:"", description:"" },
    template: "modern",
  };
}

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) await setUser(session.user, session.access_token);

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      await setUser(session.user, session.access_token);
      // Magic Link redirect – nach Login direkt zu Wizard
      if (event === "SIGNED_IN" && window.location.hash.includes("access_token")) {
        STATE.view = "wizard";
      }
    } else {
      STATE.user = null; STATE.profile = null;
    }
    render();
  });
}

async function setUser(user, token) {
  STATE.user = user;
  try {
    const res = await api("/api/me", "GET", null, token);
    STATE.profile = res;
  } catch {
    STATE.profile = { email: user.email, is_premium: false, documents_count: 0 };
  }
}

async function sendMagicLink(email) {
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: CONFIG.APP_URL }
  });
  if (error) throw error;
}

async function logout() {
  await sb.auth.signOut();
  STATE.user = null; STATE.profile = null;
  STATE.view = "home";
  toast("Abgemeldet.", "ok");
  render();
}

// ══════════════════════════════════════════════
// API HELPER
// ══════════════════════════════════════════════
async function api(path, method = "GET", body = null, tokenOverride = null) {
  let token = tokenOverride;
  if (!token) {
    const { data: { session } } = await sb.auth.getSession();
    token = session?.access_token;
  }
  const opts = {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Fehler " + res.status);
  return data;
}

// ══════════════════════════════════════════════
// GENERATE
// ══════════════════════════════════════════════
async function generate() {
  if (!STATE.user) { STATE.authModal = "login"; render(); return; }
  const p = STATE.formData;
  if (!p.personal.firstName || !p.personal.lastName) {
    toast("Bitte Vor- und Nachname eingeben.", "err"); return;
  }

  STATE.generating = true; STATE.streamPhase = "✨ Lebenslauf wird generiert …"; render();

  try {
    const { data: { session } } = await sb.auth.getSession();
    const token = session?.access_token;

    // CV generieren
    const cvRes = await api("/api/generate", "POST", {
      type: "cv",
      systemPrompt: "Du bist ein professioneller Bewerbungsexperte für den deutschsprachigen Markt. Antworte nur mit HTML-Inhalt, kein Wrapper.",
      userPrompt: `Erstelle professionellen deutschen Lebenslauf-Inhalt als HTML für:\n${JSON.stringify(p, null, 2)}\n\nOptimiert für: ${p.jobad.title || "allgemein"} bei ${p.jobad.company || "unbekannt"}. Sektionen: Profil, Berufserfahrung, Ausbildung, Kenntnisse, Sprachen.`,
    }, token);

    let letterText = "";
    if (p.jobad.title || p.jobad.description) {
      STATE.streamPhase = "✨ Anschreiben wird generiert …"; render();
      const letterRes = await api("/api/generate", "POST", {
        type: "letter",
        systemPrompt: "Du bist Experte für deutsche Bewerbungsunterlagen. Schreibe nur den Anschreiben-Text ohne HTML.",
        userPrompt: `Schreibe professionelles deutsches Anschreiben:\nBewerber: ${p.personal.firstName} ${p.personal.lastName}, ${p.personal.title || ""}\nStelle: ${p.jobad.title} bei ${p.jobad.company}\nStellenbeschreibung: ${p.jobad.description || "nicht angegeben"}\nErfahrung: ${p.experience.slice(0,3).map(e=>`${e.position} bei ${e.company}`).join("; ")}\nSkills: ${p.skills.slice(0,8).map(s=>s.name).join(", ")}\n\n350-400 Wörter, formell, überzeugend, keine Platzhalter.`,
      }, token);
      letterText = letterRes.result;
    }

    // Dokument serverseitig speichern
    STATE.streamPhase = "💾 Dokument wird gespeichert …"; render();
    const saved = await api("/api/documents", "POST", {
      name: `${p.personal.firstName} ${p.personal.lastName}${p.jobad.title ? " – " + p.jobad.title : ""}`,
      template: p.template,
      profileData: p,
      cvHtml: cvRes.result,
      coverLetter: letterText,
      jobTitle: p.jobad.title,
      jobCompany: p.jobad.company,
    }, token);

    // Profil-Counter lokal aktualisieren
    if (STATE.profile) STATE.profile.documents_count = (STATE.profile.documents_count || 0) + 1;

    toast("🎉 Bewerbung erfolgreich erstellt!", "ok");
    STATE.view = "documents";
    await loadDocuments();

  } catch (e) {
    if (e.message === "free_limit_reached") {
      STATE.view = "pricing";
    } else {
      toast("Fehler: " + e.message, "err");
    }
  } finally {
    STATE.generating = false; STATE.streamPhase = ""; render();
  }
}

// ══════════════════════════════════════════════
// DOCUMENTS
// ══════════════════════════════════════════════
async function loadDocuments() {
  if (!STATE.user) return;
  try {
    const docs = await api("/api/documents");
    STATE.documents = docs;
  } catch { STATE.documents = []; }
  render();
}

async function deleteDocument(id) {
  if (!confirm("Dokument wirklich löschen?")) return;
  try {
    await api("/api/documents?id=" + id, "DELETE");
    STATE.documents = STATE.documents.filter(d => d.id !== id);
    toast("Dokument gelöscht.", "ok");
    render();
  } catch (e) { toast("Fehler: " + e.message, "err"); }
}

// ══════════════════════════════════════════════
// STRIPE CHECKOUT
// ══════════════════════════════════════════════
async function startCheckout(plan = "lifetime") {
  if (!STATE.user) { STATE.authModal = "login"; render(); return; }
  try {
    toast("Weiterleitung zu Stripe …", "");
    const res = await api("/api/checkout", "POST", { plan });
    window.location.href = res.url;
  } catch (e) { toast("Fehler: " + e.message, "err"); }
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function toast(msg, type = "") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = (type === "ok" ? "✓ " : type === "err" ? "✕ " : "ℹ ") + msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ══════════════════════════════════════════════
// CV HTML BUILDER
// ══════════════════════════════════════════════
function buildCVHTML(profile, template) {
  const p = profile?.personal || {};
  const exp = profile?.experience || [];
  const edu = profile?.education || [];
  const skills = profile?.skills || [];
  const langs = profile?.languages || [];
  const name = `${p.firstName||""} ${p.lastName||""}`.trim();
  const contact = [p.email, p.phone, p.city ? `${p.zip||""} ${p.city}`.trim() : "", p.linkedin].filter(Boolean);

  const cvStyles = `
    .cv-h{padding:36px 40px}.cv-h h1{font-size:24px;font-weight:700;letter-spacing:-.02em;font-family:'Fraunces',serif;margin-bottom:4px}
    .cv-h .sub{font-size:13px;opacity:.85;margin-bottom:14px}.cv-h .con{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;opacity:.9}
    .cv-body{display:grid}.cv-side{padding:24px 20px;border-top:1px solid rgba(0,0,0,.08)}.cv-main{padding:24px 28px}
    .sec-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;padding-bottom:4px;border-bottom:2px solid currentColor}
    .sec{margin-bottom:20px}
    .ent{margin-bottom:12px}.ent-t{font-weight:700;font-size:13px}.ent-s{font-size:11px;color:#6b7280;margin-bottom:2px}.ent-d{font-size:12px;color:#374151;line-height:1.5}
    .sk{margin-bottom:7px}.sk-l{font-size:12px;margin-bottom:3px;display:flex;justify-content:space-between}.sk-b{height:5px;background:#e8eef8;border-radius:3px;overflow:hidden}.sk-f{height:100%;border-radius:3px}
    .lang-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#374151}
  `;

  if (template === "classic") {
    return `<style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Geist:wght@400;600;700&display=swap');${cvStyles}
    .cv-h{border-bottom:3px solid #0f172a;background:#fff}.cv-h h1{color:#0f172a}.cv-h .sub{color:#6b7280}.cv-h .con{color:#374151}
    .cv-body{grid-template-columns:1fr}.cv-main{padding:28px 40px}
    .sec-t{color:#0f172a;border-color:#0f172a}
    .ent{display:grid;grid-template-columns:130px 1fr;gap:14px}.ent-date{font-size:11px;color:#6b7280;padding-top:2px}
    </style>
    <div class="cv-h"><h1>${name}</h1><div class="sub">${p.title||""}</div><div class="con">${contact.map(c=>`<span>${c}</span>`).join("")}</div></div>
    <div class="cv-body"><div class="cv-main">
    ${p.summary?`<div class="sec"><div class="sec-t">Profil</div><p style="font-size:13px;color:#374151;line-height:1.6">${p.summary}</p></div>`:""}

function render() {

}

function renderNav() {
  return `<nav class="nav">
    <div class="nav-brand">Bewerbungs<span>KI</span></div>

    ${STATE.user
      ? `<span style="font-size:13px;color:var(--muted);margin:0 4px">${STATE.user.email?.split("@")[0]}</span>

}

function renderSidebar() {

  return `<aside class="sidebar">
    <div class="sec-lbl">Navigation</div>

      <button class="si ${STATE.view===i.v&&!STATE.authModal?"on":""}" onclick="nav('${i.v}')">
        <span style="font-size:16px">${i.icon}</span>${i.label}
        ${i.badge ? `<span class="tag" style="margin-left:auto;font-size:11px;padding:1px 7px">${i.badge}</span>` : ""}
      </button>`).join("")}

    ${!STATE.profile?.is_premium ? `
      <div style="background:linear-gradient(135deg,#eff6ff,#e0f2fe);border:1px solid #bfdbfe;border-radius:12px;padding:14px;margin:6px 4px">
        <div style="font-weight:700;font-size:13px;color:#1e40af;margin-bottom:5px">🔒 Free-Plan</div>

function renderView() {
  if (STATE.generating) return renderGenerating();
  switch (STATE.view) {
    case "home": return renderHome();
    case "wizard": return renderWizard();
    case "documents": return renderDocuments();
    case "preview": return renderPreview();
    case "pricing": return renderPricing();
    default: return renderHome();
  }
}

// ── WIZARD ──
const STEPS = [
  {id:"personal",label:"Persönliche Daten",icon:"👤"},
  {id:"experience",label:"Berufserfahrung",icon:"💼"},
  {id:"education",label:"Ausbildung",icon:"🎓"},
  {id:"skills",label:"Kenntnisse",icon:"⚡"},
  {id:"languages",label:"Sprachen",icon:"🌍"},
  {id:"jobad",label:"Stellenanzeige",icon:"📋"},
  {id:"template",label:"Vorlage",icon:"🎨"},
  {id:"generate",label:"Generieren",icon:"✨"},
];

function renderWizard() {
  const s = STATE.wizardStep;
  const step = STEPS[s];
  const pct = ((s+1)/STEPS.length*100).toFixed(0);
  return `<div class="fade">
    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <h2 style="font-family:var(--fd);font-size:22px;font-weight:700">${step.icon} ${step.label}</h2>
        <span style="font-size:13px;color:var(--muted)">Schritt ${s+1} / ${STEPS.length}</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="step-line" style="margin-top:10px">
        ${STEPS.map((st,i)=>`
          <div class="sdot ${i===s?"on":i<s?"done":""}" onclick="goStep(${i})" title="${st.label}">${i<s?"✓":i+1}</div>
          ${i<STEPS.length-1?`<div class="scon ${i<s?"done":""}"></div>`:""}`).join("")}
      </div>
    </div>
    <div class="card" style="margin-bottom:20px">${renderStep(s)}</div>
    <div style="display:flex;gap:12px;justify-content:space-between">
      <button class="btn btn-s" onclick="prevStep()" ${s===0?"disabled":""}>← Zurück</button>
      ${s<STEPS.length-1
        ? `<button class="btn btn-p" onclick="nextStep()">Weiter →</button>`
        : `<button class="btn btn-p btn-lg" onclick="generate()">✨ Bewerbung generieren</button>`}
    </div>
  </div>`;
}

function renderStep(s) {
  switch(s) {
    case 0: return renderPersonal();
    case 1: return renderExperience();
    case 2: return renderEducation();
    case 3: return renderSkills();
    case 4: return renderLanguages();
    case 5: return renderJobAd();
    case 6: return renderTemplate();
    case 7: return renderGenerateStep();
    default: return "";
  }
}

// ══════════════════════════════════════════════
// EVENT HANDLERS
// ══════════════════════════════════════════════
function attachEvents() {
  // Data-field inputs (personal, jobad)
  document.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", e => {
      const path = e.target.getAttribute("data-field").split(".");
      if (path.length === 2) STATE.formData[path[0]][path[1]] = e.target.value;
    });
  });

  // Experience inputs
  document.querySelectorAll("[data-exp]").forEach(el => {
    el.addEventListener("change", e => {
      const i = +e.target.getAttribute("data-exp");
      const key = e.target.getAttribute("data-key");
      STATE.formData.experience[i][key] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    });
    el.addEventListener("input", e => {
      const i = +e.target.getAttribute("data-exp");
      const key = e.target.getAttribute("data-key");
      if (e.target.type !== "checkbox") STATE.formData.experience[i][key] = e.target.value;
    });
  });

  // Education inputs
  document.querySelectorAll("[data-edu]").forEach(el => {
    el.addEventListener("input", e => {
      const i = +e.target.getAttribute("data-edu");
      const key = e.target.getAttribute("data-key");
      STATE.formData.education[i][key] = e.target.value;
    });
  });

  // Language inputs
  document.querySelectorAll("[data-lang]").forEach(el => {
    el.addEventListener("change", e => {
      const i = +e.target.getAttribute("data-lang");
      const key = e.target.getAttribute("data-key");
      STATE.formData.languages[i][key] = e.target.value;
    });
    el.addEventListener("input", e => {
      const i = +e.target.getAttribute("data-lang");
      const key = e.target.getAttribute("data-key");
      STATE.formData.languages[i][key] = e.target.value;
    });
  });
}

// ── GLOBAL ACTIONS ──
function nav(v) {
  STATE.view = v; STATE.authModal = false;
  if (v === "documents") loadDocuments();
  render();
}
function goStep(i) { STATE.wizardStep = i; render(); }
function nextStep() { if (STATE.wizardStep < STEPS.length-1) { STATE.wizardStep++; render(); } }
function prevStep() { if (STATE.wizardStep > 0) { STATE.wizardStep--; render(); } }
function selTemplate(t) { STATE.formData.template = t; render(); }
function toggleTheme() {
  STATE.theme = STATE.theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", STATE.theme);
  document.getElementById("root").querySelectorAll(".nav")[0] && render();
}

function addExp() { STATE.formData.experience.push({id:Date.now(),company:"",position:"",start:"",end:"",current:false,description:""}); render(); }
function delExp(i) { STATE.formData.experience.splice(i,1); render(); }
function addEdu() { STATE.formData.education.push({id:Date.now(),institution:"",degree:"",field:"",start:"",end:"",grade:""}); render(); }
function delEdu(i) { STATE.formData.education.splice(i,1); render(); }
function addLang() { STATE.formData.languages.push({id:Date.now(),language:"",level:"B2"}); render(); }
function delLang(i) { STATE.formData.languages.splice(i,1); render(); }
function addSkill() {
  const inp = document.getElementById("skill-input");
  const sel = document.getElementById("skill-level");
  if (!inp || !inp.value.trim()) return;
  STATE.formData.skills.push({id:Date.now(),name:inp.value.trim(),level:+sel.value});
  render();
}
function delSkill(i) { STATE.formData.skills.splice(i,1); render(); }

function showAuth() { STATE.authModal = "login"; render(); }
function closeAuth() { STATE.authModal = false; render(); }

async function doMagicLink() {
  const email = document.getElementById("auth-email")?.value?.trim();
  if (!email) { toast("Bitte E-Mail eingeben.", "err"); return; }
  const btn = document.getElementById("auth-btn");
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Sende …`; }
  try {
    await sendMagicLink(email);
    const msg = document.getElementById("auth-msg");
    if (msg) { msg.style.display = "block"; msg.innerHTML = "✓ Magic Link gesendet! Prüfe dein E-Mail-Postfach."; }
    if (btn) btn.style.display = "none";
  } catch(e) {
    toast("Fehler: " + e.message, "err");
    if (btn) { btn.disabled = false; btn.innerHTML = "✉️ Magic Link senden"; }
  }
}

async function previewDoc(id) {
  try {
    const doc = await api("/api/documents?id=" + id);
    STATE.previewDoc = doc;
    STATE.view = "preview";
    render();
  } catch(e) { toast("Dokument konnte nicht geladen werden.", "err"); }
}

function switchTab(tab) {
  const cvEl = document.getElementById("tab-content-cv");
  const lEl = document.getElementById("tab-content-letter");
  const btnCv = document.getElementById("tab-cv");
  const btnL = document.getElementById("tab-letter");
  if (tab === "cv") {
    if (cvEl) cvEl.style.display = "block";
    if (lEl) lEl.style.display = "none";
    if (btnCv) { btnCv.className = "btn btn-p btn-sm"; }
    if (btnL) { btnL.className = "btn btn-s btn-sm"; }
  } else {
    if (cvEl) cvEl.style.display = "none";
    if (lEl) lEl.style.display = "block";
    if (btnCv) { btnCv.className = "btn btn-s btn-sm"; }
    if (btnL) { btnL.className = "btn btn-p btn-sm"; }
  }
}

function printCV() {
  const doc = STATE.previewDoc;
  if (!doc) return;
  const w = window.open("", "_blank");
  const html = buildCVHTML(doc.profile_data, doc.template);
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lebenslauf – ${doc.name||""}</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Geist',sans-serif;color:#111;background:white}@page{size:A4;margin:0}@media print{body{margin:0}}</style>
  </head><body>${html}</body></html>`);
  w.document.close();
  setTimeout(()=>{w.focus();w.print();}, 800);
}

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── CHECK SUCCESS PAGE ──
if (window.location.search.includes("session_id=")) {
  toast("🎉 Zahlung erfolgreich! Premium ist jetzt aktiv.", "ok");
  window.history.replaceState({}, "", "/");
}

// ── INIT ──
initAuth().then(() => render());
</script>
